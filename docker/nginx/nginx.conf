worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream api_gateway_upstream {
        server api-gateway-1:4000 max_fails=3 fail_timeout=10s;
        server api-gateway-2:4000 max_fails=3 fail_timeout=10s;
        server api-gateway-3:4000 max_fails=3 fail_timeout=10s;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    client_max_body_size 500m;

    log_format upstreamlog '$remote_addr -> $upstream_addr '
                           '"$request" status=$status '
                           'rt=$request_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log upstreamlog;
    error_log  /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        location /socket.io/ {
            # proxy_pass с переменной заставляет nginx резолвить имя в рантайме.
            # $request_uri обязателен: при переменной URI сам не подставляется.
            set $collab_backend http://collaboration-service:5003;
            proxy_pass $collab_backend$request_uri;

            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location / {
            proxy_pass http://api_gateway_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }
    }
}
